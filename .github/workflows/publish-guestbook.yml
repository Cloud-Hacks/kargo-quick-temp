name: Publish new image
run-name: Publish new image of guestbook

# Triggers on every push to main, with no path filter, so the commit that builds
# the image is always the same commit the Warehouse's Git subscription selects.
# If this is narrowed, the Warehouse's includePaths must be narrowed identically
# or freightCreationCriteria will never match.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  packages: write
  attestations: write
  contents: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: afzal442/guestbook

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: afzal442
          password: ${{ secrets.GH_TOKEN }}
      - name: Compute release metadata
        run: |
          echo "VERSION=v0.0.${{ github.run_number }}" >> $GITHUB_ENV
          echo "CREATED=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_ENV
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        id: push
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          provenance: false
          build-args: |
            GIT_REVISION=${{ github.sha }}
            VERSION=${{ env.VERSION }}
            CREATED=${{ env.CREATED }}
          labels: |
            org.opencontainers.image.title=Guestbook
            org.opencontainers.image.description=Guestbook demo application
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.created=${{ env.CREATED }}
            org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          annotations: |
            index,manifest:org.opencontainers.image.title=Guestbook
            index,manifest:org.opencontainers.image.description=Guestbook demo application
            index,manifest:org.opencontainers.image.revision=${{ github.sha }}
            index,manifest:org.opencontainers.image.version=${{ env.VERSION }}
            index,manifest:org.opencontainers.image.created=${{ env.CREATED }}
            index,manifest:org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}
            index,manifest:org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Tag release in git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git tag -a "${VERSION}" -m "Release ${VERSION}"
          git push origin "${VERSION}"
