name: Publish new image
run-name: Publish new image of guestbook

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - '.github/workflows/publish-guestbook.yml'
  workflow_dispatch:

permissions:
  packages: write
  attestations: write
  contents: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: afzal442/guestbook
  SOURCE_TAG: latest

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: afzal442
          password: ${{ secrets.GH_TOKEN }}
      - name: Compute version tag
        run: echo "VERSION=v0.0.${{ github.run_number }}" >> $GITHUB_ENV
      - name: Push version tag
        id: push
        run: |
          set -euo pipefail
          IMAGE="${REGISTRY}/${IMAGE_NAME}"
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.title=Guestbook" \
            --annotation "index:org.opencontainers.image.description=Guestbook demo application" \
            --annotation "index:org.opencontainers.image.revision=${GITHUB_SHA}" \
            --annotation "index:org.opencontainers.image.version=${VERSION}" \
            --annotation "index:org.opencontainers.image.url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --annotation "index:org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --annotation "index:org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -t "${IMAGE}:${VERSION}" \
            -t "${IMAGE}:latest" \
            "${IMAGE}:${SOURCE_TAG}"
          DIGEST=$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{.Manifest.Digest}}')
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Pushed ${IMAGE}:${VERSION} (${DIGEST}) revision=${GITHUB_SHA}"
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Tag release in git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git tag -a "${VERSION}" -m "Release ${VERSION}"
          git push origin "${VERSION}"
